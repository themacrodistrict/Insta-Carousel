<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Macro District Carousel Studio</title>
  <style>
    :root {
      --bg: #12100d;
      --panel: #1f1c17;
      --panel-2: #29241d;
      --text: #fff9ef;
      --muted: #b9afa1;
      --line: #3d3529;
      --gold: #e8bf73;
      --gold-soft: #ffe0a6;
      --danger: #e57373;
      --field: #15130f;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(232, 191, 115, 0.14), transparent 30%),
        linear-gradient(135deg, #12100d 0%, #21190f 48%, #151515 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 100vh;
      padding: 24px;
      overflow: auto;
      background: rgba(18, 16, 13, 0.76);
      border-right: 1px solid rgba(232, 191, 115, 0.18);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 6px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold-soft);
      font-family: Georgia, serif;
      font-size: 17px;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .group {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025));
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
    }

    .group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      color: var(--gold-soft);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field span,
    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .triple {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      min-height: 42px;
      padding: 10px 11px;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: var(--field);
      outline: none;
    }

    input[type="file"] {
      width: 100%;
      color: var(--muted);
      font-size: 13px;
    }

    input:focus,
    select:focus {
      border-color: rgba(232, 191, 115, 0.7);
      box-shadow: 0 0 0 3px rgba(232, 191, 115, 0.13);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--gold);
    }

    .range-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px;
      align-items: center;
      gap: 10px;
    }

    .readout {
      padding: 7px 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--gold-soft);
      font-size: 12px;
      text-align: center;
    }

    .range-row .number-input {
      min-height: 38px;
      padding: 7px 6px;
      color: var(--gold-soft);
      text-align: center;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      position: sticky;
      bottom: -1px;
      padding-top: 8px;
      background: linear-gradient(180deg, rgba(18, 16, 13, 0), rgba(18, 16, 13, 0.96) 32%);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 8px;
      color: #16120d;
      background: var(--gold);
      font-weight: 800;
    }

    .btn.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn:hover {
      filter: brightness(1.05);
    }

    .btn:disabled {
      cursor: progress;
      filter: saturate(0.65);
      opacity: 0.72;
    }

    .stage-wrap {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100vh;
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 2px 18px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .canvas-shell {
      display: grid;
      place-items: center;
      min-height: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background:
        linear-gradient(45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.035) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.035) 75%),
        #171512;
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: min(78vh, 100%);
      height: auto;
      max-height: calc(100vh - 110px);
      background: #0f0e0c;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.42);
    }

    .tiny {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      .controls {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid rgba(232, 191, 115, 0.18);
      }

      .stage-wrap {
        min-height: auto;
        padding: 16px;
      }

      canvas {
        width: min(100%, 720px);
        max-height: none;
      }
    }

    @media (max-width: 540px) {
      .controls {
        padding: 16px;
      }

      .field-inline,
      .triple,
      .actions {
        grid-template-columns: 1fr;
      }

      .brand {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="controls" aria-label="Carousel Einstellungen">
      <div class="brand">
        <div>
          <h1>The Macro District Studio</h1>
          <p class="subtitle">Instagram Carousel Cover Generator</p>
        </div>
        <div class="brand-mark" aria-label="TDM">TDM</div>
      </div>

      <section class="group">
        <p class="group-title">Bild</p>
        <div class="field">
          <label for="imageUpload">Hintergrund</label>
          <input id="imageUpload" type="file" accept="image/*,video/*,.mp4,.mov,.webm,.m4v">
        </div>
        <label class="field" for="format">
          <span>Format</span>
          <select id="format">
            <option value="square">1080 x 1080</option>
            <option value="portrait">1080 x 1350</option>
          </select>
        </label>
        <div class="field">
          <span>Zoom</span>
          <div class="range-row">
            <input id="imageZoom" type="range" min="1" max="3" step="0.01" value="1.16">
            <output class="readout" id="imageZoomOut">116%</output>
          </div>
        </div>
        <div class="field-inline">
          <div class="field">
            <span>X</span>
            <div class="range-row">
              <input id="imageX" type="range" min="-100" max="100" step="1" value="18">
              <input class="readout number-input" id="imageXOut" type="number" min="-100" max="100" step="1" value="18" aria-label="Bild X als Zahl">
            </div>
          </div>
          <div class="field">
            <span>Y</span>
            <div class="range-row">
              <input id="imageY" type="range" min="-100" max="100" step="1" value="0">
              <input class="readout number-input" id="imageYOut" type="number" min="-100" max="100" step="1" value="0" aria-label="Bild Y als Zahl">
            </div>
          </div>
        </div>
      </section>

      <section class="group">
        <p class="group-title">Rezept</p>
        <div class="field">
          <label for="label">Kategorie</label>
          <input id="label" type="text" value="HIGH PROTEIN">
        </div>
        <div class="field">
          <label for="recipeTitle">Titel</label>
          <input id="recipeTitle" type="text" value="TIRAMISU">
        </div>
        <div class="field-inline">
          <label class="field" for="calories">
            <span>Kalorien</span>
            <input id="calories" type="text" value="540">
          </label>
          <label class="field" for="protein">
            <span>Protein</span>
            <input id="protein" type="text" value="48g">
          </label>
        </div>
        <div class="triple">
          <label class="field" for="carbs">
            <span>Carbs</span>
            <input id="carbs" type="text" value="52g">
          </label>
          <label class="field" for="fat">
            <span>Fat</span>
            <input id="fat" type="text" value="14g">
          </label>
          <label class="field" for="fiber">
            <span>Fiber</span>
            <input id="fiber" type="text" value="8g">
          </label>
        </div>
        <div class="field">
          <label for="footer">Footer</label>
          <input id="footer" type="text" value="PER SERVING">
        </div>
      </section>

      <section class="group">
        <p class="group-title">Overlay</p>
        <div class="field">
          <span>Groesse</span>
          <div class="range-row">
            <input id="overlayScale" type="range" min="50" max="150" step="1" value="100">
            <input class="readout number-input" id="overlayScaleOut" type="number" min="50" max="150" step="1" value="100" aria-label="Overlay Groesse als Zahl">
          </div>
        </div>
        <div class="field-inline">
          <div class="field">
            <span>X</span>
            <div class="range-row">
              <input id="overlayX" type="range" min="0" max="100" step="1" value="4">
              <input class="readout number-input" id="overlayXOut" type="number" min="0" max="100" step="1" value="4" aria-label="Overlay X als Zahl">
            </div>
          </div>
          <div class="field">
            <span>Y</span>
            <div class="range-row">
              <input id="overlayY" type="range" min="0" max="100" step="1" value="41">
              <input class="readout number-input" id="overlayYOut" type="number" min="0" max="100" step="1" value="41" aria-label="Overlay Y als Zahl">
            </div>
          </div>
        </div>
        <div class="field">
          <span>Transparenz</span>
          <div class="range-row">
            <input id="overlayOpacity" type="range" min="45" max="95" step="1" value="72">
            <output class="readout" id="overlayOpacityOut">72%</output>
          </div>
        </div>
        <div class="field">
          <span>Blur</span>
          <div class="range-row">
            <input id="overlayBlur" type="range" min="0" max="28" step="1" value="16">
            <output class="readout" id="overlayBlurOut">16</output>
          </div>
        </div>
      </section>

      <div class="actions">
        <button class="btn secondary" id="resetBtn" type="button" title="Werte zuruecksetzen">
          Reset
        </button>
        <button class="btn" id="downloadBtn" type="button" title="PNG exportieren">
          PNG
        </button>
      </div>
    </aside>

    <section class="stage-wrap" aria-label="Vorschau">
      <div class="topbar">
        <div>
          <strong>Live Preview</strong>
          <div class="status" id="status">Bereit fuer Upload, Crop und Export.</div>
        </div>
        <div class="tiny" id="sizeInfo">1080 x 1080 px</div>
      </div>
      <div class="canvas-shell">
        <canvas id="poster" width="1080" height="1080" aria-label="Instagram Carousel Vorschau"></canvas>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("poster");
    const ctx = canvas.getContext("2d");

    const defaultState = {
      format: "square",
      label: "HIGH PROTEIN",
      recipeTitle: "TIRAMISU",
      calories: "540",
      protein: "48g",
      carbs: "52g",
      fat: "14g",
      fiber: "8g",
      footer: "PER SERVING",
      imageZoom: 1.16,
      imageX: 18,
      imageY: 0,
      overlayScale: 100,
      overlayX: 4,
      overlayY: 41,
      overlayOpacity: 72,
      overlayBlur: 16
    };

    const fields = {
      imageUpload: document.getElementById("imageUpload"),
      format: document.getElementById("format"),
      label: document.getElementById("label"),
      recipeTitle: document.getElementById("recipeTitle"),
      calories: document.getElementById("calories"),
      protein: document.getElementById("protein"),
      carbs: document.getElementById("carbs"),
      fat: document.getElementById("fat"),
      fiber: document.getElementById("fiber"),
      footer: document.getElementById("footer"),
      imageZoom: document.getElementById("imageZoom"),
      imageX: document.getElementById("imageX"),
      imageY: document.getElementById("imageY"),
      overlayScale: document.getElementById("overlayScale"),
      overlayX: document.getElementById("overlayX"),
      overlayY: document.getElementById("overlayY"),
      overlayOpacity: document.getElementById("overlayOpacity"),
      overlayBlur: document.getElementById("overlayBlur")
    };

    const readouts = {
      imageZoom: document.getElementById("imageZoomOut"),
      imageX: document.getElementById("imageXOut"),
      imageY: document.getElementById("imageYOut"),
      overlayScale: document.getElementById("overlayScaleOut"),
      overlayX: document.getElementById("overlayXOut"),
      overlayY: document.getElementById("overlayYOut"),
      overlayOpacity: document.getElementById("overlayOpacityOut"),
      overlayBlur: document.getElementById("overlayBlurOut")
    };

    const statusEl = document.getElementById("status");
    const sizeInfo = document.getElementById("sizeInfo");
    const resetBtn = document.getElementById("resetBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let image = null;
    let video = null;
    let mediaUrl = "";
    let mediaKind = "empty";
    let previewAnimation = null;
    let exportAnimation = null;
    let isExporting = false;
    let state = { ...defaultState };

    function syncStateFromInputs() {
      Object.keys(defaultState).forEach((key) => {
        const field = fields[key];
        if (!field) return;
        if (field.type === "range" || field.type === "number") {
          state[key] = Number(field.value);
        } else {
          state[key] = field.value;
        }
      });
      updateReadouts();
    }

    function updateInputsFromState() {
      Object.keys(defaultState).forEach((key) => {
        const field = fields[key];
        if (field) field.value = state[key];
      });
      updateReadouts();
    }

    function setControlValue(element, value) {
      if (!element) return;
      if ("value" in element) {
        element.value = value;
      } else {
        element.textContent = value;
      }
    }

    function updateReadouts() {
      setControlValue(readouts.imageZoom, `${Math.round(state.imageZoom * 100)}%`);
      setControlValue(readouts.imageX, state.imageX);
      setControlValue(readouts.imageY, state.imageY);
      setControlValue(readouts.overlayScale, state.overlayScale);
      setControlValue(readouts.overlayX, state.overlayX);
      setControlValue(readouts.overlayY, state.overlayY);
      setControlValue(readouts.overlayOpacity, `${state.overlayOpacity}%`);
      setControlValue(readouts.overlayBlur, state.overlayBlur);
      updateExportButton();
    }

    function clamp(value, min, max) {
      if (!Number.isFinite(value)) return min;
      return Math.min(max, Math.max(min, value));
    }

    function applyNumberControl(key, element, commit = false) {
      if (!element.value || element.value === "-") return;
      const min = Number(element.min);
      const max = Number(element.max);
      const rawValue = Number(element.value);
      if (!Number.isFinite(rawValue)) return;
      if (!commit && (rawValue < min || rawValue > max)) return;
      const nextValue = commit ? clamp(rawValue, min, max) : rawValue;
      fields[key].value = nextValue;
      if (commit) element.value = nextValue;
      render();
    }

    function getVideoMimeType() {
      if (!window.MediaRecorder) return "";
      const types = [
        "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
        "video/mp4;codecs=h264,aac",
        "video/mp4",
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
      ];
      return types.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function videoExtension(mimeType) {
      return mimeType.includes("mp4") ? "mp4" : "webm";
    }

    function updateExportButton() {
      if (isExporting) return;
      if (mediaKind === "video") {
        const mimeType = getVideoMimeType();
        downloadBtn.textContent = mimeType ? videoExtension(mimeType).toUpperCase() : "VIDEO";
      } else {
        downloadBtn.textContent = "PNG";
      }
    }

    function fitText(text, maxWidth, baseSize, minSize, fontFace, weight = "700") {
      let size = baseSize;
      ctx.font = `${weight} ${size}px ${fontFace}`;
      while (ctx.measureText(text).width > maxWidth && size > minSize) {
        size -= 2;
        ctx.font = `${weight} ${size}px ${fontFace}`;
      }
      return size;
    }

    function roundRectPath(x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function drawPlaceholder() {
      const width = canvas.width;
      const height = canvas.height;
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, "#1c1711");
      gradient.addColorStop(0.46, "#3a2717");
      gradient.addColorStop(1, "#0f0f0f");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width * 0.66, height * 0.43);
      ctx.rotate(-0.05);
      ctx.fillStyle = "#eee4d0";
      ctx.beginPath();
      ctx.ellipse(0, 0, width * 0.32, height * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#7a4a24";
      for (let i = 0; i < 180; i += 1) {
        const x = (Math.random() - 0.5) * width * 0.58;
        const y = (Math.random() - 0.5) * height * 0.32;
        ctx.globalAlpha = 0.32;
        ctx.fillRect(x, y, Math.random() * 12 + 3, Math.random() * 5 + 1);
      }
      ctx.restore();

      ctx.globalAlpha = 0.36;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, width, height);
      ctx.globalAlpha = 1;
    }

    function drawMediaCover() {
      const width = canvas.width;
      const height = canvas.height;
      let source = image;
      let sourceWidth = image ? image.width : 0;
      let sourceHeight = image ? image.height : 0;

      if (mediaKind === "video" && video && video.readyState >= 2 && video.videoWidth) {
        source = video;
        sourceWidth = video.videoWidth;
        sourceHeight = video.videoHeight;
      }

      if (!source || !sourceWidth || !sourceHeight) {
        drawPlaceholder();
        return;
      }

      const coverScale = Math.max(width / sourceWidth, height / sourceHeight) * state.imageZoom;
      const imgWidth = sourceWidth * coverScale;
      const imgHeight = sourceHeight * coverScale;
      const x = (width - imgWidth) / 2 + (state.imageX / 100) * width * 0.5;
      const y = (height - imgHeight) / 2 + (state.imageY / 100) * height * 0.5;

      ctx.drawImage(source, x, y, imgWidth, imgHeight);

      const vignette = ctx.createRadialGradient(width * 0.6, height * 0.43, width * 0.16, width * 0.5, height * 0.48, width * 0.77);
      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, "rgba(0,0,0,0.52)");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, width, height);
    }

    const macroIconSvgs = {
      flame: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="12" x2="52" y1="8" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE3AD"/><stop offset=".52" stop-color="#E8BF73"/><stop offset="1" stop-color="#C99343"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#000" flood-opacity=".32"/></filter></defs><g filter="url(#s)" fill="none" stroke="url(#g)" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"><path fill="#E8BF73" fill-opacity=".075" d="M31.1 57.3c-11.7-4-18.4-12.5-18.4-22.1 0-7.2 3.8-13.6 10.2-18.7 3.7-3 6.4-6.7 7-11.6 7 4.8 10.7 11.4 10.5 18.7 4.1-2.4 6.8-6.2 7.4-10.9 6.2 6.1 8.5 14 6.5 21.5-2.4 9.3-10.1 18-22.2 23-.3.1-.7.1-1 .1Z"/><path d="M31.7 54.3c-5.1-2.6-8.1-7.2-8-12.2.1-5 3.2-9.2 8.8-12.7-.2 4.6 1.9 8 5.8 10.5 2-2.2 3-5 2.9-8.6 4.7 3.6 7.2 8.3 6.8 13.1-.4 5.3-4.7 9.7-11.2 11.8"/></g></svg>`,
      arm: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="11" x2="55" y1="8" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE3AD"/><stop offset=".5" stop-color="#E8BF73"/><stop offset="1" stop-color="#C99343"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.5" flood-color="#000" flood-opacity=".34"/></filter></defs><g filter="url(#s)" fill="none" stroke="url(#g)" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"><path fill="#E8BF73" fill-opacity=".075" d="M12.5 43.8c3-10.1 9-16.3 18-18.5l6.4-13.4c1.6-3.4 6.3-4.2 9-1.5 3.1 3.1 2.5 9.3-1.8 14.9 6.7-2 13.2-.3 15.8 4.3 2.1 3.7-.8 7.9-5 7.3l-9.2-1.4c1.6 7.2-2.6 14.5-10.5 18.1-10.5 4.8-20.9.9-22.7-9.8Z"/><path d="M30.8 25.3c-6.2-5.5-4.4-15.3 3.5-19.5M36.5 12.8c5.7 3.2 6.8 9.1 3.3 14.8M30.1 33.4c5 5.7 14.4 7 24.8 3.5M17.9 42.3c4.8 4.3 11.7 4.8 18 1.3"/></g></svg>`,
      wheat: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="14" x2="50" y1="6" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE3AD"/><stop offset=".54" stop-color="#E8BF73"/><stop offset="1" stop-color="#C99343"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.1" stdDeviation="1.3" flood-color="#000" flood-opacity=".32"/></filter></defs><g filter="url(#s)" fill="#E8BF73" fill-opacity=".075" stroke="url(#g)" stroke-width="3.35" stroke-linecap="round" stroke-linejoin="round"><path fill="none" d="M32 58V8"/><path d="M31.6 16.2C23.1 8.1 16.5 8.8 12 15.2c5.7 5.4 12 5.9 19.6 1Z"/><path d="M32.4 22.4c8.8-8.3 15.5-7.6 19.8-1-5.8 5.5-12.2 6-19.8 1Z"/><path d="M31.6 30.7C22.7 22.5 15.7 23 11.3 29.7c6 5.5 12.6 6 20.3 1Z"/><path d="M32.4 37.2c9-8.2 15.9-7.6 20.3-1-6 5.5-12.7 5.9-20.3 1Z"/><path d="M31.6 45.4c-8.1-7-14.2-6.3-18.3-.4 5.4 4.8 11.2 5.2 18.3.4Z"/></g></svg>`,
      drop: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="15" x2="49" y1="5" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE3AD"/><stop offset=".52" stop-color="#E8BF73"/><stop offset="1" stop-color="#C99343"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#000" flood-opacity=".32"/></filter></defs><g filter="url(#s)" fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path fill="#E8BF73" fill-opacity=".075" d="M32 6.5c12.6 14 18.7 24.2 18.7 34.1C50.7 52.2 42.7 59 32 59s-18.7-6.8-18.7-18.4C13.3 30.7 19.4 20.5 32 6.5Z"/><path d="M22.6 42.5c2.5 6.2 9.7 9 16.1 5.8"/></g></svg>`,
      cube: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="10" x2="55" y1="7" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE3AD"/><stop offset=".52" stop-color="#E8BF73"/><stop offset="1" stop-color="#C99343"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#000" flood-opacity=".32"/></filter></defs><g filter="url(#s)" fill="none" stroke="url(#g)" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path fill="#E8BF73" fill-opacity=".075" d="M32 6.5 55 19.7v24.6L32 57.5 9 44.3V19.7L32 6.5Z"/><path d="M9 19.7 32 33l23-13.3M32 33v24.5M20.7 13 43.6 26.2"/></g></svg>`
    };

    const macroIconImages = {};
    const macroIconReady = loadMacroIcons();

    function loadMacroIcons() {
      const entries = Object.entries(macroIconSvgs);
      return Promise.all(entries.map(([type, svg]) => new Promise((resolve) => {
        const icon = new Image();
        icon.onload = () => {
          macroIconImages[type] = icon;
          resolve();
        };
        icon.onerror = resolve;
        icon.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }))).then(() => render(false));
    }

    function drawMacroIcon(type, x, y, size) {
      const icon = macroIconImages[type];
      if (!icon) return;
      ctx.save();
      ctx.shadowColor = "rgba(232,191,115,0.22)";
      ctx.shadowBlur = 5;
      ctx.drawImage(icon, x - size / 2, y - size / 2, size, size);
      ctx.restore();
    }

    function drawLogo(cx, cy, radius, scale) {
      ctx.save();
      ctx.strokeStyle = "#e8bf73";
      ctx.lineWidth = 2.2 * scale;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#e8bf73";
      ctx.font = `${Math.round(20 * scale)}px Georgia, serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("TDM", cx, cy + 1 * scale);
      ctx.restore();
    }

    function drawOverlay() {
      const scale = state.overlayScale / 100;
      const baseW = 438;
      const baseH = 665;
      const panelW = baseW * scale;
      const panelH = baseH * scale;
      const width = canvas.width;
      const height = canvas.height;
      const maxX = width - panelW - 40 * scale;
      const maxY = height - panelH - 40 * scale;
      const x = 40 * scale + (state.overlayX / 100) * Math.max(0, maxX - 40 * scale);
      const y = 32 * scale + (state.overlayY / 100) * Math.max(0, maxY - 32 * scale);
      const gold = "#e8bf73";
      const white = "#fffaf3";
      const muted = "#f4cf8c";

      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.35)";
      ctx.shadowBlur = 20 * scale;
      ctx.shadowOffsetY = 8 * scale;
      roundRectPath(x, y, panelW, panelH, 19 * scale);
      ctx.fillStyle = `rgba(22, 21, 18, ${state.overlayOpacity / 100})`;
      ctx.fill();

      ctx.save();
      roundRectPath(x, y, panelW, panelH, 19 * scale);
      ctx.clip();
      ctx.globalAlpha = 0.45;
      ctx.filter = `blur(${state.overlayBlur}px)`;
      ctx.drawImage(canvas, x - panelW * 0.03, y - panelH * 0.03, panelW * 1.06, panelH * 1.06, x, y, panelW, panelH);
      ctx.restore();

      roundRectPath(x, y, panelW, panelH, 19 * scale);
      ctx.strokeStyle = "rgba(255,255,255,0.86)";
      ctx.lineWidth = 1.3 * scale;
      ctx.stroke();

      ctx.shadowColor = "transparent";
      const cx = x + panelW / 2;
      let currentY = y + 52 * scale;
      drawLogo(cx, currentY, 27 * scale, scale);

      currentY += 61 * scale;
      ctx.fillStyle = muted;
      ctx.font = `${Math.round(18 * scale)}px Inter, Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(state.label.toUpperCase(), cx, currentY);

      currentY += 69 * scale;
      const title = state.recipeTitle.toUpperCase();
      const titleSize = fitText(title, panelW - 96 * scale, 54 * scale, 28 * scale, "Impact, 'Arial Narrow', Arial, sans-serif", "400");
      ctx.font = `400 ${titleSize}px Impact, "Arial Narrow", Arial, sans-serif`;
      ctx.fillStyle = white;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(title, cx, currentY);

      currentY += 64 * scale;
      ctx.strokeStyle = "rgba(232,191,115,0.72)";
      ctx.lineWidth = 1.1 * scale;
      ctx.beginPath();
      ctx.moveTo(x + 42 * scale, currentY);
      ctx.lineTo(x + panelW - 42 * scale, currentY);
      ctx.stroke();

      currentY += 63 * scale;
      drawMacroIcon("flame", x + 82 * scale, currentY, 42 * scale);
      ctx.fillStyle = white;
      ctx.font = `800 ${Math.round(55 * scale)}px Inter, Arial, sans-serif`;
      ctx.textAlign = "left";
      ctx.fillText(state.calories, x + 135 * scale, currentY);
      ctx.fillStyle = muted;
      ctx.font = `500 ${Math.round(18 * scale)}px Inter, Arial, sans-serif`;
      ctx.fillText("CALORIES", x + 270 * scale, currentY + 2 * scale);

      currentY += 72 * scale;
      drawMacroIcon("arm", x + 82 * scale, currentY, 47 * scale);
      ctx.fillStyle = white;
      ctx.font = `800 ${Math.round(51 * scale)}px Inter, Arial, sans-serif`;
      ctx.fillText(state.protein, x + 135 * scale, currentY);
      ctx.fillStyle = muted;
      ctx.font = `500 ${Math.round(18 * scale)}px Inter, Arial, sans-serif`;
      ctx.fillText("PROTEIN", x + 270 * scale, currentY + 2 * scale);

      currentY += 55 * scale;
      ctx.strokeStyle = "rgba(232,191,115,0.72)";
      ctx.lineWidth = 1.1 * scale;
      ctx.beginPath();
      ctx.moveTo(x + 42 * scale, currentY);
      ctx.lineTo(x + panelW - 42 * scale, currentY);
      ctx.stroke();

      const macroY = currentY + 66 * scale;
      const columns = [
        { icon: "wheat", value: state.carbs, label: "CARBS", x: x + panelW * 0.22 },
        { icon: "drop", value: state.fat, label: "FAT", x: x + panelW * 0.5 },
        { icon: "cube", value: state.fiber, label: "FIBER", x: x + panelW * 0.78 }
      ];

      ctx.textAlign = "center";
      columns.forEach((macro) => {
        drawMacroIcon(macro.icon, macro.x, macroY - 39 * scale, 31 * scale);
        ctx.fillStyle = white;
        ctx.font = `800 ${Math.round(34 * scale)}px Inter, Arial, sans-serif`;
        ctx.fillText(macro.value, macro.x, macroY + 5 * scale);
        ctx.fillStyle = muted;
        ctx.font = `500 ${Math.round(17 * scale)}px Inter, Arial, sans-serif`;
        ctx.fillText(macro.label, macro.x, macroY + 39 * scale);
      });

      ctx.strokeStyle = "rgba(255,255,255,0.44)";
      ctx.lineWidth = 1 * scale;
      [x + panelW * 0.36, x + panelW * 0.64].forEach((lineX) => {
        ctx.beginPath();
        ctx.moveTo(lineX, currentY + 23 * scale);
        ctx.lineTo(lineX, currentY + 122 * scale);
        ctx.stroke();
      });

      const footerLineY = y + panelH - 78 * scale;
      ctx.strokeStyle = "rgba(232,191,115,0.72)";
      ctx.beginPath();
      ctx.moveTo(x + 42 * scale, footerLineY);
      ctx.lineTo(x + panelW - 42 * scale, footerLineY);
      ctx.stroke();

      ctx.fillStyle = muted;
      ctx.font = `600 ${Math.round(18 * scale)}px Inter, Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(state.footer.toUpperCase(), cx, y + panelH - 38 * scale);
      ctx.restore();
    }

    function render(syncInputs = true) {
      if (syncInputs) syncStateFromInputs();
      const isPortrait = state.format === "portrait";
      canvas.width = 1080;
      canvas.height = isPortrait ? 1350 : 1080;
      sizeInfo.textContent = `${canvas.width} x ${canvas.height} px`;

      drawMediaCover();
      drawOverlay();
    }

    function clearMediaUrl() {
      if (mediaUrl) URL.revokeObjectURL(mediaUrl);
      mediaUrl = "";
    }

    function stopVideoPreview() {
      if (previewAnimation) cancelAnimationFrame(previewAnimation);
      previewAnimation = null;
    }

    function startVideoPreview() {
      stopVideoPreview();
      const tick = () => {
        if (mediaKind === "video" && !isExporting) {
          render(false);
          previewAnimation = requestAnimationFrame(tick);
        }
      };
      previewAnimation = requestAnimationFrame(tick);
    }

    function downloadBlob(blob, name) {
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.download = name;
      link.href = url;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 2500);
    }

    function cleanFileName(extension) {
      const cleanName = (state.recipeTitle || "tdm-carousel-cover")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9-]+/g, "-")
        .replace(/^-+|-+$/g, "") || "tdm-carousel-cover";
      return `${cleanName}.${extension}`;
    }

    function waitForSeek(targetTime) {
      return new Promise((resolve) => {
        if (!video || !Number.isFinite(video.duration)) {
          resolve();
          return;
        }
        const done = () => {
          video.removeEventListener("seeked", done);
          resolve();
        };
        video.addEventListener("seeked", done);
        video.currentTime = Math.min(targetTime, Math.max(0, video.duration - 0.04));
        setTimeout(done, 900);
      });
    }

    function resetAll() {
      state = { ...defaultState };
      updateInputsFromState();
      statusEl.textContent = "Werte wurden zurueckgesetzt.";
      render();
    }

    async function downloadPoster() {
      await macroIconReady;
      render();
      canvas.toBlob((blob) => {
        const fileName = cleanFileName("png");
        downloadBlob(blob, fileName);
        statusEl.textContent = `Exportiert: ${fileName}`;
      }, "image/png");
    }

    async function downloadVideo() {
      if (!video || mediaKind !== "video") {
        downloadPoster();
        return;
      }
      await macroIconReady;
      const mimeType = getVideoMimeType();
      if (!canvas.captureStream || !window.MediaRecorder || !mimeType) {
        statusEl.textContent = "Videoexport wird in diesem Browser nicht unterstuetzt.";
        return;
      }

      isExporting = true;
      stopVideoPreview();
      downloadBtn.disabled = true;
      downloadBtn.textContent = "REC";
      const previousTime = video.currentTime;
      const wasPaused = video.paused;
      const previousLoop = video.loop;
      const seconds = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
      if (!seconds) {
        statusEl.textContent = "Die Videolaenge konnte nicht erkannt werden.";
        isExporting = false;
        downloadBtn.disabled = false;
        updateExportButton();
        startVideoPreview();
        return;
      }
      const chunks = [];
      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: 9000000
      });

      const stopped = new Promise((resolve) => {
        recorder.ondataavailable = (event) => {
          if (event.data && event.data.size) chunks.push(event.data);
        };
        recorder.onstop = resolve;
      });

      await waitForSeek(0);
      video.loop = false;
      await video.play().catch(() => {});

      const startedAt = performance.now();
      const secondsLabel = seconds.toFixed(1);
      const drawExportFrame = () => {
        const elapsed = (performance.now() - startedAt) / 1000;
        render(false);
        statusEl.textContent = `Videoexport ${Math.min(seconds, elapsed).toFixed(1)} / ${secondsLabel}s`;
        if (elapsed < seconds && !video.ended && recorder.state === "recording") {
          exportAnimation = requestAnimationFrame(drawExportFrame);
        } else if (recorder.state === "recording") {
          recorder.stop();
        }
      };

      recorder.start(250);
      drawExportFrame();
      await stopped;
      if (exportAnimation) cancelAnimationFrame(exportAnimation);
      exportAnimation = null;
      stream.getTracks().forEach((track) => track.stop());

      const extension = videoExtension(mimeType);
      const fileName = cleanFileName(extension);
      downloadBlob(new Blob(chunks, { type: mimeType }), fileName);
      statusEl.textContent = `Exportiert: ${fileName}`;

      video.loop = previousLoop;
      if (Number.isFinite(previousTime)) await waitForSeek(previousTime);
      if (wasPaused) {
        video.pause();
      } else {
        await video.play().catch(() => {});
      }
      isExporting = false;
      downloadBtn.disabled = false;
      updateExportButton();
      startVideoPreview();
    }

    function exportCurrentMedia() {
      if (mediaKind === "video") {
        downloadVideo();
      } else {
        downloadPoster();
      }
    }

    fields.imageUpload.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith("video/") || /\.(mp4|mov|m4v|webm)$/i.test(file.name);
      clearMediaUrl();
      stopVideoPreview();

      if (isVideo) {
        image = null;
        video = document.createElement("video");
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "auto";
        mediaUrl = URL.createObjectURL(file);
        video.src = mediaUrl;
        video.addEventListener("loadeddata", async () => {
          mediaKind = "video";
          statusEl.textContent = `Video geladen: ${file.name}`;
          updateExportButton();
          render();
          await video.play().catch(() => {
            statusEl.textContent = "Video geladen. Export startet per Klick.";
          });
          startVideoPreview();
        }, { once: true });
        video.addEventListener("error", () => {
          statusEl.textContent = "Das Video konnte nicht geladen werden.";
        }, { once: true });
        return;
      }

      video = null;
      mediaUrl = URL.createObjectURL(file);
      const nextImage = new Image();
      nextImage.onload = () => {
        image = nextImage;
        mediaKind = "image";
        statusEl.textContent = `Bild geladen: ${file.name}`;
        updateExportButton();
        render();
      };
      nextImage.onerror = () => {
        statusEl.textContent = "Das Bild konnte nicht geladen werden.";
      };
      nextImage.src = mediaUrl;
    });

    ["imageX", "imageY", "overlayScale", "overlayX", "overlayY"].forEach((key) => {
      const readout = readouts[key];
      readout.addEventListener("input", () => applyNumberControl(key, readout));
      readout.addEventListener("change", () => applyNumberControl(key, readout, true));
    });

    Object.values(fields).forEach((field) => {
      if (field === fields.imageUpload) return;
      field.addEventListener("input", render);
      field.addEventListener("change", render);
    });

    resetBtn.addEventListener("click", resetAll);
    downloadBtn.addEventListener("click", exportCurrentMedia);

    updateInputsFromState();
    render();
  </script>
</body>
</html>
